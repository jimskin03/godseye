services:
  gods-eye-view-v2:
    image: gods-eye-view:v2
    container_name: gods-eye-view-v2
    build:
      context: .
      dockerfile: Dockerfile.v2
      args:
        GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
        CESIUM_ION_TOKEN: ${CESIUM_ION_TOKEN:-}
    env_file:
      - .env
    environment:
      NODE_ENV: production
    network_mode: host
    command: ["./node_modules/.bin/vite", "preview", "--host", "0.0.0.0", "--port", "5174"]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:5174/"]
      interval: 20s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
